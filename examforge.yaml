# ExamForge configuration
# Override defaults here. CLI flags take precedence over this file.

mode: fast

engines:
  paddlevl:
    model_name: PaddleOCR-VL-1.6
    pipeline_version: "v1.6"
    api_url: null
    lang: ["en", "hi"]
    use_gpu: false
    timeout_s: 60.0
  paddleocr:
    model_name: PaddleOCR-VL-1.6
    pipeline_version: "v1.6"
    lang: ["en", "hi"]
    use_gpu: false
    timeout_s: 60.0
  tesseract:
    lang: ["eng+hin"]
    timeout_s: 30.0

browser:
  pool_size: 2
  timeout_ms: 30000

agent:
  enabled: false

paths:
  runs: ./runs
  ledger: ./ledger
  cache: ./.cache

fail_policy: fail_page
debug: false

# Feature flags for v2 release
flags:
  verifiers_v2: true
  layout_v2: true
  figures_v2: true
  clean_v2: true
  lang_v2: true
  answers: true
  s7_repair: true
  bank: true
  autoprofile: true
  lessons: true
  template_v2: true
  exporters: true
