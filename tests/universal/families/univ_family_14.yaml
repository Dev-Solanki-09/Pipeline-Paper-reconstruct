id: univ_family_14
name: Universal Benchmark Family 14
profile_version: 2.0.0
engine_min_version: 2.0.0
maturity: experimental
extends:
- base
languages:
- code: en
  script: Latn
  direction: ltr
language_layout: monolingual
layout:
  columns: 3
  spans_allowed: true
  reading_order: columns_ltr
  orientation_policy: portrait
numbering:
  patterns:
  - ^\s*Q\.?\s*(\d{1,3})\s*[.]?
  sections:
  - PHYSICS
  - CHEMISTRY
  - MATHEMATICS
  - BIOLOGY
  reset_policy: continuous
  nesting_labels:
  - (a)
  - (b)
  - (c)
  - (d)
options:
  label_schemes:
  - (1)
  - (2)
  - (3)
  - (4)
  count_min: 2
  count_max: 4
  count_typical: 4
  layout_preference: auto
  image_option_policy: allow
furniture_branding:
  headers:
  - EXAM\s*PAPER
  footers:
  - Page\s*\d+
  branding: []
  watermark:
    enabled: true
    mode: subtract
    patterns:
    - LOGO
expected_kinds:
- match
marking:
  positive: 4.0
  negative: -1.0
  partial: false
answer_key_patterns: []
rules: {}
autofix_allowlist: []
output:
  template: exam.html.j2
  layout_mode: single_column
  exporters:
  - html
  - json
  include_answers: false
requires: []
capability_policy: warn
compute: standard
